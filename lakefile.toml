name = "lean-linter"
version = "0.5.0"
description = "Find what the type checker cannot: misnamed lemmas, wrong docstrings, dead references, duplicates"
keywords = ["linter", "mathlib", "lean4", "code-quality"]
license = "Apache-2.0"
homepage = "https://github.com/keithadler/lean-linter"
defaultTargets = ["lean-linter"]

[[lean_lib]]
name = "LeanLinter"

[[lean_exe]]
name = "lean-linter"
root = "Main"
supportInterpreter = true

[[lean_lib]]
name = "LeanLinterTest"
srcDir = "test"
